name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONDONTWRITEBYTECODE: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  test:
    name: test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv and Python
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.13.4"
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --all-groups --locked

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Lint
        run: uv run ruff check .

      - name: Type check
        run: uv run mypy

      - name: Test with coverage
        run: uv run pytest -m "not network" --cov --cov-report=term-missing

  security:
    name: security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv and Python
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.13.4"
          python-version: "3.12"
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --all-groups --locked

      - name: Bandit
        run: uv run bandit -c pyproject.toml -r src

      - name: pip-audit
        run: uv run pip-audit

  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.13.4"
          python-version: "3.12"
          enable-cache: true

      - name: Build distributions
        run: uv build

      - name: Inspect wheel contents
        run: |
          python - <<'PY'
          import glob, zipfile
          wheel = glob.glob("dist/*.whl")[0]
          with zipfile.ZipFile(wheel) as archive:
              names = archive.namelist()
          required = ["stpt_mcp/__init__.py", "stpt_mcp/data/network.json"]
          missing = [name for name in required if name not in names]
          if not any(name.endswith(".dist-info/entry_points.txt") for name in names):
              missing.append(".dist-info/entry_points.txt")
          if missing:
              raise SystemExit(f"wheel is missing: {missing}")
          print(f"{wheel}: {len(names)} entries; required files present")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/*
          if-no-files-found: error

  container:
    name: container
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t stpt-mcp:ci .

      - name: Run and check health
        run: |
          docker run --detach --name stpt-mcp-ci \
            --publish 127.0.0.1:18000:8000 \
            --env STPT_MCP_ALLOWED_HOSTS=127.0.0.1:18000 \
            stpt-mcp:ci
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:18000/healthz; then
              exit 0
            fi
            sleep 1
          done
          echo "health check did not become ready" >&2
          exit 1

      - name: Container logs
        if: failure()
        run: docker logs stpt-mcp-ci || true

      - name: Stop container
        if: always()
        run: docker rm --force stpt-mcp-ci || true
